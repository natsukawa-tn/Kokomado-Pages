<section class="hero"><img src="../assets/icon.png" alt=""><h1>心窗</h1><p><b>两个人的小窗</b></p><p>每天给 TA 留一张卡片——涂鸦、照片或一句话。它会出现在 TA 的桌面和锁屏上。</p></section><div class="grid"><div class="card"><h3>每天一张</h3><p>每天只能留一张，所以每一张都珍贵。</p></div><div class="card"><h3>出现在 TA 的桌面</h3><p>小组件显示 TA 最新的卡片，还有在一起的天数。</p></div><div class="card"><h3>回忆墙</h3><p>一天天的卡片排成日历，留住两个人的每一天。</p></div><div class="card"><h3>只属于你们</h3><p>没有广告，卡片只保存在你们两个人的 iCloud 里。</p></div></div>
